version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: express-postgres
    environment:
      POSTGRES_USER: matheusfbio
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: crud-user
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matheusfbio"]
      interval: 10s
      timeout: 5s
      retries: 5

